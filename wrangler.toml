name = "divine-wind-102e"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Serves everything in /public automatically for any request
# that the Worker code below does not explicitly handle (i.e. everything
# except /api/*).
[assets]
directory = "./Public"
binding = "ASSETS"

# Cloudflare D1 database — this is where every post you add from
# /admin.html is stored. Create it once with:
#   npx wrangler d1 create tuktakmovies-db
# then paste the database_id it prints into the line below.
[[d1_databases]]
binding = "DB"
database_name = "tuktakmovies-db"
database_id = "80b5691d-41da-457a-8f87-3ad8ca60c830"
