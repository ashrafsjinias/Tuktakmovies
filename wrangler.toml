name = "tuktakmovies"
main = "src/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./public"

[[d1_databases]]
binding = "DB"
database_name = "tuktakmovies-db"
database_id = "80b5691d-41da-457a-8f87-3ad8ca60c830"

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tuktakmovies-media"

[vars]
SITE_URL = "https://tuktakmovies.online"
SITE_NAME = "TuktakMovies"

# Secrets (set via: wrangler secret put SECRET_NAME)
# TMDB_API_KEY
# JWT_SECRET
# ADMIN_EMAIL
# ADMIN_PASSWORD_HASH
# YOUTUBE_API_KEY (optional)

[env.production]
name = "tuktakmovies-production"
route = { pattern = "tuktakmovies.online/*", zone_name = "tuktakmovies.online" }

[env.preview]
name = "tuktakmovies-preview"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]
