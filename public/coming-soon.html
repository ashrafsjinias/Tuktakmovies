<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon — TukTakMovies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .coming-soon{max-width:600px;margin:0 auto;padding:80px 20px;text-align:center;}
  .coming-soon h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);margin:0 0 14px;}
  .coming-soon p{csecretar(--ink-soft);font-size:15.5px;margin:0 0 24px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">🎬</span>
      <span class="logo-text">TUKTAK<strong>MOVIES</strong>
        <small>MOVIE NEWS, REVIEWS &amp; MORE</small>
      </span>
    </a>
  </div>
</header>

<main class="coming-soon">
  <h1 id="cs-title">Coming Soon</h1>
  <p id="cs-text">This section is still being built.</p>
  <a href="/" class="btn btn-primary">← Back to home</a>
</main>

<script>
  const section = new URLSearchParams(location.search).get("section") || "This section";
  document.getElementById("cs-title").textContent = `${section} — Coming Soon`;
  document.getElementById("cs-text").textContent = `${section} isn't live yet. Check back soon!`;
  document.title = `${section} — Coming Soon`;
</script>
</body>
</html>
