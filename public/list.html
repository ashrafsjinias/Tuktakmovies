<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse — TukTakMovies</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

  .list-page{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  .list-page h1{
    font-family:var(--serif);
    font-size:clamp(24px,3vw,32px);
    margin:0 0 26px;
  }

  .list-empty{
    color:var(--ink-soft);
    padding:40px 0;
    text-align:center;
    grid-column:1 / -1;
  }

  .list-pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:40px;
  }

  .list-pagination button{
    min-width:42px;
    height:42px;
    padding:0 12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:6px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    transition:.2s ease;
  }

  .list-pagination button:hover:not(:disabled){
    background:var(--ink);
    color:var(--paper);
  }

  .list-pagination button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .list-pagination button:disabled{
    opacity:.45;
    cursor:not-allowed;
  }

  .list-pagination .dots{
    padding:0 4px;
    color:var(--ink-soft);
  }

  .list-loading{
    grid-column:1 / -1;
    text-align:center;
    padding:40px 0;
    color:var(--ink-soft);
  }

</style>

</head>

<body>

<header class="site-header">

  <div class="container header-inner">

```
<a href="/" class="logo">

  <span class="logo-mark">🎬</span>

  <span class="logo-text">
    TUKTAK<strong>MOVIES</strong>

    <small>
      MOVIE NEWS, REVIEWS &amp; MORE
    </small>

  </span>

</a>
```

  </div>

</header>

<main class="list-page">

  <h1 id="list-title">
    Browse
  </h1>

  <div
    class="grid grid-4"
    id="list-grid"
  ></div>

  <nav
    class="list-pagination"
    id="list-pagination"
    aria-label="Pagination"
  ></nav>

</main>

<script>


const POSTS_PER_PAGE = 24;


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function thumbHtmlForList(post) {

  const title =
    escapeHtml(post.title || "Untitled");


  const img = post.image
    ? `<img
        src="${escapeHtml(post.image)}"
        alt="${title} poster"
        loading="lazy"
      >`

    : `<div class="no-image">
        ${title}
      </div>`;


  const score =
    post.score ?? post.rating;


  const badge =
    score != null
      ? `<span class="score">
          ${score}
        </span>`
      : "";


  return `
    <div class="thumb">

      ${img}

      ${badge}

    </div>
  `;

}


function getPostUrl(post) {

  if (!post.id) {
    return "#";
  }


  if (post.media_type === "tv") {
    return `/tv/${post.id}`;
  }


  return `/movie/${post.id}`;

}


function getVisiblePages(current, total) {

  if (total <= 7) {

    return Array.from(
      { length: total },
      (_, index) => index + 1
    );

  }


  const pages = [1];


  if (current > 4) {
    pages.push("...");
  }


  const start =
    Math.max(
      2,
      current - 2
    );


  const end =
    Math.min(
      total - 1,
      current + 2
    );


  for (
    let page = start;
    page <= end;
    page++
  ) {

    pages.push(page);

  }


  if (current < total - 3) {
    pages.push("...");
  }


  pages.push(total);


  return pages;

}


function updateUrl(params, page) {

  const newParams =
    new URLSearchParams(
      params
    );


  newParams.set(
    "page",
    page
  );


  history.pushState(
    {},
    "",
    `${location.pathname}?${newParams.toString()}`
  );

}


function renderPagination(
  currentPage,
  totalPages,
  params,
  loadPage
) {

  const pagination =
    document.getElementById(
      "list-pagination"
    );


  pagination.innerHTML = "";


  if (totalPages <= 1) {
    return;
  }


  const previousButton =
    document.createElement(
      "button"
    );


  previousButton.textContent =
    "← Previous";


  previousButton.disabled =
    currentPage <= 1;


  previousButton.addEventListener(
    "click",
    () => {

      if (currentPage > 1) {

        updateUrl(
          params,
          currentPage - 1
        );


        loadPage(
          currentPage - 1
        );

      }

    }
  );


  pagination.appendChild(
    previousButton
  );


  const pages =
    getVisiblePages(
      currentPage,
      totalPages
    );


  pages.forEach(
    page => {


      if (page === "...") {

        const dots =
          document.createElement(
            "span"
          );


        dots.className =
          "dots";


        dots.textContent =
          "...";


        pagination.appendChild(
          dots
        );


        return;

      }


      const button =
        document.createElement(
          "button"
        );


      button.textContent =
        page;


      if (
        page === currentPage
      ) {

        button.classList.add(
          "active"
        );

      }


      button.addEventListener(
        "click",
        () => {

          if (
            page !== currentPage
          ) {

            updateUrl(
              params,
              page
            );


            loadPage(
              page
            );

          }

        }
      );


      pagination.appendChild(
        button
      );

    }
  );


  const nextButton =
    document.createElement(
      "button"
    );


  nextButton.textContent =
    "Next →";


  nextButton.disabled =
    currentPage >= totalPages;


  nextButton.addEventListener(
    "click",
    () => {

      if (
        currentPage <
        totalPages
      ) {

        updateUrl(
          params,
          currentPage + 1
        );


        loadPage(
          currentPage + 1
        );

      }

    }
  );


  pagination.appendChild(
    nextButton
  );

}


async function loadList(
  requestedPage = null
) {

  const params =
    new URLSearchParams(
      location.search
    );


  const type =
    params.get("type")
    || "movie";


  const media =
    params.get("media");


  const industry =
    params.get("industry");


  const genre =
    params.get("genre");


  const sort =
    params.get("sort")
    || "newest";


  let currentPage =
    requestedPage
    || Number(
      params.get("page")
    )
    || 1;


  if (currentPage < 1) {
    currentPage = 1;
  }


  const titles = {

    review:
      "Movie Reviews",

    article:
      "Articles",

    trending:
      "Trending Now",

    featured:
      "Featured"

  };


  let title;


  if (industry) {

    title =
      `${industry} Movies`;

  }

  else if (
    media === "tv"
  ) {

    title =
      "TV Shows";

  }

  else if (
    genre
  ) {

    title =
      `${genre} Movies`;

  }

  else {

    title =
      titles[type]
      || (
        type === "movie"
          ? "Movies"
          : "Browse"
      );

  }


  document
    .getElementById(
      "list-title"
    )
    .textContent =
    title;


  document.title =
    `${title} — TukTakMovies`;


  const grid =
    document.getElementById(
      "list-grid"
    );


  const pagination =
    document.getElementById(
      "list-pagination"
    );


  grid.innerHTML =
    `<p class="list-loading">
      Loading...
    </p>`;


  pagination.innerHTML =
    "";


  try {


    const qs =
      new URLSearchParams();


    qs.set(
      "type",
      type
    );


    qs.set(
      "limit",
      POSTS_PER_PAGE
    );


    qs.set(
      "page",
      currentPage
    );


    qs.set(
      "sort",
      sort
    );


    if (media) {

      qs.set(
        "media",
        media
      );

    }


    if (industry) {

      qs.set(
        "industry",
        industry
      );

    }


    if (genre) {

      qs.set(
        "genre",
        genre
      );

    }


    const res =
      await fetch(
        `/api/posts?${qs.toString()}`
      );


    if (!res.ok) {

      throw new Error(
        "Failed to load posts"
      );

    }


    const data =
      await res.json();


    const posts =
      data.posts
      || [];


    if (
      !posts.length
    ) {

      grid.innerHTML =
        `<p class="list-empty">
          No posts here yet.
        </p>`;


      return;

    }


    grid.innerHTML =
      posts.map(
        p => `

        <a
          class="card"
          href="${getPostUrl(p)}"
        >

          ${thumbHtmlForList(p)}

          <div class="body">

            <h3>
              ${escapeHtml(
                p.title
              )}
            </h3>


            <div class="sub">

              <span>
                ${
                  escapeHtml(
                    p.post_date
                    || p.year
                    || ""
                  )
                }
              </span>


              ${
                p.comments
                  ? `<span>
                      💬 ${p.comments}
                    </span>`
                  : ""
              }

            </div>

          </div>

        </a>

      `
      ).join(
        ""
      );


    const total =
      Number(
        data.total
        || 0
      );


    const totalPages =
      Math.ceil(
        total
        / POSTS_PER_PAGE
      );


    renderPagination(
      currentPage,
      totalPages,
      params,
      loadList
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  }

  catch (error) {


    console.error(
      error
    );


    grid.innerHTML =
      `<p class="list-empty">
        Couldn't load posts right now.
      </p>`;


  }

}


document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadList();

  }
);


window.addEventListener(
  "popstate",
  () => {

    loadList();

  }
);


</script>

</body>
</html>
