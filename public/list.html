<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse — TukTakMovies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .back-link{display:inline-block;margin-bottom:16px;font-size:14px;font-weight:600;color:var(--accent);}
  .list-page{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  .list-page h1{font-family:var(--serif);font-size:clamp(24px,3vw,32px);margin:0 0 26px;}
  .list-empty{color:var(--ink-soft);padding:40px 0;text-align:center;}
  .pagination-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:30px;}
  .pagination-controls .page-btn{padding:9px 18px;border:1px solid var(--line);border-radius:7px;background:#fff;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;}
  .pagination-controls .page-btn:disabled{opacity:.4;cursor:default;}
  .pagination-controls .page-info{font-size:13.5px;color:var(--ink-soft);}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">🎬</span>
      <span class="logo-text">TUKTAK<strong>MOVIES</strong>
        <small>MOVIE NEWS, REVIEWS &amp; MORE</small>
      </span>
    </a>
  </div>
</header>

<main class="list-page" id="list-page">
  <a href="/" class="back-link">← Back to home</a>
  <h1 id="list-title">Browse</h1>
  <div class="grid grid-4" id="list-grid"></div>
  <div id="list-pagination" class="pagination-controls"></div>
</main>

<script src="js/pagination.js"></script>
<script>
  function thumbHtmlForList(post) {
    const img = post.image
      ? `<img src="${post.image}" alt="${post.title} poster" loading="lazy">`
      : `<div class="no-image">${post.title}</div>`;
    const score = post.score ?? post.rating;
    const badge = score != null ? `<span class="score">${score}</span>` : "";
    return `<div class="thumb">${img}${badge}</div>`;
  }

  async function loadList() {
    // Public clean listing pages are server-rendered by the Worker.
    // Do not fetch and re-paginate them again in the browser.
    if (document.getElementById("list-page")?.dataset.ssr === "true") return;

    const params = new URLSearchParams(location.search);
    const type = params.get("type") || "movie";
    const media = params.get("media"); // "movie" or "tv" — only meaningful when type=movie
    const titles = { review: "Movie Reviews", article: "Articles", trending: "Trending Now", featured: "Featured" };
    const title = media === "tv" ? "TV Shows" : (titles[type] || (type === "movie" ? "Movies" : "Browse"));
    document.getElementById("list-title").textContent = title;
    document.title = `${title} — TukTakMovies`;

    const grid = document.getElementById("list-grid");
    try {
      const qs = new URLSearchParams({ type, limit: "100" });
      if (media) qs.set("media", media);
      const res = await fetch(`/api/posts?${qs.toString()}`);
      const data = res.ok ? await res.json() : { posts: [] };
      const posts = data.posts || [];
      if (!posts.length) {
        grid.innerHTML = `<p class="list-empty">No posts here yet.</p>`;
        return;
      }

      function renderListPage(pageItems) {
        grid.innerHTML = pageItems.map(p => `
          <a class="card" href="${p.media_type === "tv" ? "/tv/" : "/movie/"}${p.id}">
            ${thumbHtmlForList(p)}
            <div class="body">
              <h3>${p.title}</h3>
              <div class="sub">
                <span>${p.post_date || p.year || ""}</span>
                ${p.comments ? `<span>💬 ${p.comments}</span>` : ""}
              </div>
            </div>
          </a>`).join("");
      }

      paginate(posts, { perPage: 12, containerId: "list-pagination", onRender: renderListPage });
    } catch {
      grid.innerHTML = `<p class="list-empty">Couldn't load posts right now.</p>`;
    }
  }
  document.addEventListener("DOMContentLoaded", loadList);
</script>
</body>
</html>
