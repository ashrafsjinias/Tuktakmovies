<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Browse — TukTakMovies
</title>


<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
  rel="stylesheet"
>


<link
  rel="stylesheet"
  href="css/style.css"
>


<style>

  .list-page{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 60px;
  }


  .list-page h1{
    font-family:var(--serif);
    font-size:clamp(24px,3vw,32px);
    margin:0 0 26px;
  }


  .list-empty{
    color:var(--ink-soft);
    padding:40px 0;
    text-align:center;
    grid-column:1 / -1;
  }


  /* Pagination */

  .pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:40px;
    flex-wrap:wrap;
  }


  .pagination button{
    border:1px solid rgba(0,0,0,.12);
    background:#fff;
    color:#111;
    min-width:40px;
    height:40px;
    padding:0 12px;
    border-radius:6px;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
  }


  .pagination button:hover:not(:disabled){
    opacity:.8;
  }


  .pagination button.active{
    background:#111;
    color:#fff;
    border-color:#111;
  }


  .pagination button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

</style>

</head>


<body>


<header class="site-header">

  <div class="container header-inner">

    <a
      href="/"
      class="logo"
    >

      <span class="logo-mark">
        🎬
      </span>


      <span class="logo-text">

        TUKTAK<strong>MOVIES</strong>


        <small>
          MOVIE NEWS, REVIEWS &amp; MORE
        </small>

      </span>

    </a>

  </div>

</header>



<main class="list-page">


  <h1 id="list-title">
    Browse
  </h1>



  <div
    class="grid grid-4"
    id="list-grid"
  >
  </div>



  <div
    class="pagination"
    id="pagination"
  >
  </div>


</main>



<script>


/* =========================
   SETTINGS
========================= */

const POSTS_PER_PAGE = 20;



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}



/* =========================
   THUMBNAIL
========================= */

function thumbHtmlForList(post) {


  const img =
    post.image

      ? `<img
           src="${post.image}"
           alt="${escapeHtml(post.title)} poster"
           loading="lazy"
         >`

      : `<div class="no-image">
           ${escapeHtml(post.title)}
         </div>`;


  const score =
    post.score ??
    post.rating;


  const badge =
    score !== null &&
    score !== undefined

      ? `<span class="score">
           ${score}
         </span>`

      : "";


  return `

    <div class="thumb">

      ${img}

      ${badge}

    </div>

  `;

}



/* =========================
   PAGINATION UI
========================= */

function renderPagination(
  currentPage,
  totalPages
) {


  const pagination =
    document.getElementById(
      "pagination"
    );


  pagination.innerHTML =
    "";


  if (
    totalPages <= 1
  ) {

    return;

  }


  function goToPage(page) {


    const params =
      new URLSearchParams(
        location.search
      );


    params.set(
      "page",
      page
    );


    location.href =
      `${location.pathname}?${params.toString()}`;

  }



  /* Previous */

  const previousButton =
    document.createElement(
      "button"
    );


  previousButton.textContent =
    "← Previous";


  previousButton.disabled =
    currentPage <= 1;


  previousButton.addEventListener(
    "click",
    () => {

      if (
        currentPage > 1
      ) {

        goToPage(
          currentPage - 1
        );

      }

    }
  );


  pagination.appendChild(
    previousButton
  );



  /*
    Page numbers
  */

  const maxVisible =
    5;


  let startPage =
    Math.max(

      1,

      currentPage -

      Math.floor(
        maxVisible / 2
      )

    );


  let endPage =
    Math.min(

      totalPages,

      startPage +
      maxVisible -
      1

    );


  if (
    endPage -
    startPage +
    1 <

    maxVisible
  ) {

    startPage =
      Math.max(

        1,

        endPage -
        maxVisible +
        1

      );

  }



  /*
    First page
  */

  if (
    startPage > 1
  ) {


    const firstButton =
      document.createElement(
        "button"
      );


    firstButton.textContent =
      "1";


    firstButton.addEventListener(
      "click",
      () => goToPage(1)
    );


    pagination.appendChild(
      firstButton
    );


    if (
      startPage > 2
    ) {

      const dots =
        document.createElement(
          "span"
        );


      dots.textContent =
        "...";


      pagination.appendChild(
        dots
      );

    }

  }



  /*
    Visible pages
  */

  for (
    let page =
      startPage;

    page <=
      endPage;

    page++
  ) {


    const button =
      document.createElement(
        "button"
      );


    button.textContent =
      page;


    if (
      page ===
      currentPage
    ) {

      button.classList.add(
        "active"
      );

    }


    button.addEventListener(
      "click",
      () => goToPage(page)
    );


    pagination.appendChild(
      button
    );

  }



  /*
    Last page
  */

  if (
    endPage <
    totalPages
  ) {


    if (
      endPage <
      totalPages - 1
    ) {


      const dots =
        document.createElement(
          "span"
        );


      dots.textContent =
        "...";


      pagination.appendChild(
        dots
      );

    }


    const lastButton =
      document.createElement(
        "button"
      );


    lastButton.textContent =
      totalPages;


    lastButton.addEventListener(
      "click",
      () => goToPage(
        totalPages
      )
    );


    pagination.appendChild(
      lastButton
    );

  }



  /*
    Next
  */

  const nextButton =
    document.createElement(
      "button"
    );


  nextButton.textContent =
    "Next →";


  nextButton.disabled =
    currentPage >=
    totalPages;


  nextButton.addEventListener(
    "click",
    () => {

      if (
        currentPage <
        totalPages
      ) {

        goToPage(
          currentPage + 1
        );

      }

    }
  );


  pagination.appendChild(
    nextButton
  );

}



/* =========================
   LOAD LIST
========================= */

async function loadList() {


  const params =
    new URLSearchParams(
      location.search
    );


  const type =
    params.get(
      "type"
    ) ||
    "movie";


  const media =
    params.get(
      "media"
    );


  const page =
    Math.max(

      1,

      Number(

        params.get(
          "page"
        ) ||

        "1"

      )

    );



  /*
    Page title
  */

  const titles = {

    review:
      "Movie Reviews",

    article:
      "Articles",

    trending:
      "Trending Now",

    featured:
      "Featured"

  };


  const title =

    media === "tv"

      ? "TV Shows"

      : (

        titles[type] ||

        (

          type === "movie"

            ? "Movies"

            : "Browse"

        )

      );


  document
    .getElementById(
      "list-title"
    )
    .textContent =
    title;


  document.title =
    `${title} — TukTakMovies`;



  const grid =
    document.getElementById(
      "list-grid"
    );


  const pagination =
    document.getElementById(
      "pagination"
    );


  grid.innerHTML =
    `<p class="list-empty">
      Loading...
    </p>`;


  pagination.innerHTML =
    "";



  try {


    /*
      API Query
    */

    const qs =
      new URLSearchParams({

        type:
          type,

        page:
          page,

        limit:
          POSTS_PER_PAGE

      });


    if (
      media
    ) {

      qs.set(
        "media",
        media
      );

    }



    const response =
      await fetch(

        `/api/posts?${qs.toString()}`

      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Could not load posts"
      );

    }



    const data =
      await response.json();


    const posts =
      data.posts ||
      [];


    const pageInfo =
      data.pagination ||
      {};


    /*
      No posts
    */

    if (
      !posts.length
    ) {


      grid.innerHTML =
        `<p class="list-empty">
          No posts here yet.
        </p>`;


      return;

    }



    /*
      Render cards
    */

    grid.innerHTML =

      posts.map(
        post => {


          const link =

            post.media_type === "tv"

              ? `/tv/${post.id}`

              : `/movie/${post.id}`;



          return `

            <a
              class="card"
              href="${link}"
            >

              ${thumbHtmlForList(post)}


              <div class="body">


                <h3>

                  ${escapeHtml(
                    post.title
                  )}

                </h3>



                <div class="sub">


                  <span>

                    ${escapeHtml(

                      post.post_date ||

                      post.year ||

                      ""

                    )}

                  </span>



                  ${

                    post.comments

                      ?

                      `<span>
                        💬 ${post.comments}
                      </span>`

                      :

                      ""

                  }


                </div>


              </div>


            </a>

          `;

        }

      ).join("");



    /*
      Pagination
    */

    renderPagination(

      Number(
        pageInfo.page ||
        page
      ),

      Number(
        pageInfo.totalPages ||
        0
      )

    );


  }


  catch (
    error
  ) {


    console.error(
      error
    );


    grid.innerHTML =
      `<p class="list-empty">
        Couldn't load posts right now.
      </p>`;


    pagination.innerHTML =
      "";

  }

}



/* =========================
   INITIAL LOAD
========================= */

document.addEventListener(

  "DOMContentLoaded",

  loadList

);


</script>


</body>
</html>
