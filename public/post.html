<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — TukTakMovies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Small, page-specific styles only — the rest comes from css/style.css */
  .post-detail{max-width:820px;margin:0 auto;padding:28px 20px 60px;}
  .post-detail .post-hero-img{width:100%;max-height:420px;object-fit:cover;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;}
  .post-detail h1{font-family:var(--serif);font-size:clamp(24px,3.2vw,36px);margin:0 0 6px;}
  .post-detail .tagline{font-style:italic;color:var(--ink-soft);margin:0 0 14px;}
  .post-detail .post-meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px;margin-bottom:16px;}
  .post-detail .post-meta .stars{color:var(--gold);font-weight:600;}
  .post-detail .genre-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .post-detail .genre-pills span{background:var(--bg);border:1px solid var(--line);padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .post-detail .post-excerpt{font-size:16px;line-height:1.7;margin-bottom:20px;}
  .post-detail .cast-line{font-size:14px;color:var(--ink-soft);margin-bottom:26px;}
  .post-detail .cast-line strong{color:var(--ink);}
  .post-detail .watch-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:26px;}
  .post-detail .watch-section h3{margin:0 0 10px;font-size:15px;}
  .post-detail .watch-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .post-detail .watch-pills a{background:var(--bg);border:1px solid var(--line);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;transition:background .15s ease,border-color .15s ease;}
  .post-detail .watch-pills a:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  .post-detail .watch-note{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .post-detail .watch-note a{color:var(--accent);font-weight:600;}
  .post-detail .trailer-wrap{position:relative;width:100%;padding-top:56.25%;margin-bottom:26px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#000;}
  .post-detail .trailer-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .post-detail .back-link{display:inline-block;margin-bottom:18px;font-size:14px;font-weight:600;color:var(--accent);}
  .post-detail .not-found{text-align:center;padding:60px 20px;color:var(--ink-soft);}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">🎬</span>
      <span class="logo-text">TUKTAK<strong>MOVIES</strong>
        <small>MOVIE NEWS, REVIEWS &amp; MORE</small>
      </span>
    </a>
  </div>
</header>

<main class="post-detail" id="post-detail">
  <a href="/" class="back-link">← Back to home</a>
  <p>Loading…</p>
</main>

<script>
  // Best-effort fallback homepages, used only when a movie has no
  // movie-specific watch_link from TMDB/JustWatch yet. Not movie-specific —
  // just gets the visitor to the right service to search themselves.
  const PROVIDER_HOMEPAGES = {
    "Netflix": "https://www.netflix.com/",
    "Amazon Prime Video": "https://www.primevideo.com/",
    "Amazon Video": "https://www.primevideo.com/",
    "Disney Plus": "https://www.disneyplus.com/",
    "Disney+": "https://www.disneyplus.com/",
    "Apple TV": "https://tv.apple.com/",
    "Apple TV Plus": "https://tv.apple.com/",
    "Apple TV+": "https://tv.apple.com/",
    "HBO Max": "https://www.max.com/",
    "Max": "https://www.max.com/",
    "Hulu": "https://www.hulu.com/",
    "Peacock": "https://www.peacocktv.com/",
    "Paramount Plus": "https://www.paramountplus.com/",
    "Paramount+": "https://www.paramountplus.com/",
    "YouTube": "https://www.youtube.com/movies",
    "Google Play Movies": "https://play.google.com/store/movies",
    "Vudu": "https://www.vudu.com/",
    "Starz": "https://www.starz.com/",
    "Showtime": "https://www.showtime.com/",
    "Crunchyroll": "https://www.crunchyroll.com/",
    "MUBI": "https://mubi.com/",
    "BritBox": "https://www.britbox.com/",
    "Discovery Plus": "https://www.discoveryplus.com/",
    "ESPN Plus": "https://plus.espn.com/",
  };

  function providerLinkFor(name, watchLink) {
    // Prefer the movie-specific link (accurate for this exact title/region);
    // fall back to the provider's own homepage only when we have nothing better.
    return watchLink || PROVIDER_HOMEPAGES[name] || null;
  }

  function renderWatchSection(post) {
    const providers = (post.watch_providers || "")
      .split(",").map(p => p.trim()).filter(Boolean);
    if (!providers.length && !post.watch_link) {
      return `
        <div class="watch-section">
          <h3>Where to Watch</h3>
          <p class="watch-note">Streaming availability isn't listed for this title yet.</p>
        </div>`;
    }
    const pills = providers.map(name => {
      const href = providerLinkFor(name, post.watch_link);
      return href
        ? `<a href="${href}" target="_blank" rel="noopener">${name}</a>`
        : `<a href="#" onclick="return false;" style="cursor:default;">${name}</a>`;
    }).join("");
    return `
      <div class="watch-section">
        <h3>Where to Watch</h3>
        ${pills ? `<div class="watch-pills">${pills}</div>` : ""}
        <p class="watch-note">
          Availability may vary by region and change over time.
          ${post.watch_link ? `<a href="${post.watch_link}" target="_blank" rel="noopener">Check current availability →</a>` : ""}
        </p>
      </div>`;
  }

  async function loadPost() {
    const root = document.getElementById("post-detail");
    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      root.innerHTML = `<a href="/" class="back-link">← Back to home</a><p class="not-found">No post specified.</p>`;
      return;
    }
    try {
      const res = await fetch(`/api/posts/${id}`);
      if (!res.ok) throw new Error("not found");
      const { post } = await res.json();

      document.title = `${post.title} — TukTakMovies`;

      const metaParts = [];
      if (post.post_date) metaParts.push(`📅 ${post.post_date}`);
      if (post.year) metaParts.push(post.year);
      if (post.runtime) {
        const h = Math.floor(post.runtime / 60), m = post.runtime % 60;
        metaParts.push(h ? `${h}h ${m}m` : `${m}m`);
      }
      if (post.comments) metaParts.push(`💬 ${post.comments} Comments`);
      const ratingValue = post.rating ?? post.score;
      if (ratingValue != null) metaParts.push(`<span class="stars">⭐ ${ratingValue}</span>`);

      const genrePills = (post.genres || "")
        .split(",").map(g => g.trim()).filter(Boolean)
        .map(g => `<span>${g}</span>`).join("");

      const heroImg = post.backdrop || post.image;

      root.innerHTML = `
        <a href="/" class="back-link">← Back to home</a>
        ${heroImg ? `<img class="post-hero-img" src="${heroImg}" alt="${post.title}">` : ""}
        <h1>${post.title}</h1>
        ${post.tagline ? `<p class="tagline">${post.tagline}</p>` : ""}
        <div class="post-meta">${metaParts.map(p => `<span>${p}</span>`).join("")}</div>
        ${genrePills ? `<div class="genre-pills">${genrePills}</div>` : ""}
        ${post.trailer_key ? `
          <div class="trailer-wrap">
            <iframe src="https://www.youtube.com/embed/${post.trailer_key}" title="Trailer" allowfullscreen loading="lazy"></iframe>
          </div>` : ""}
        ${post.excerpt ? `<p class="post-excerpt">${post.excerpt}</p>` : ""}
        ${post.cast_names ? `<p class="cast-line"><strong>Starring:</strong> ${post.cast_names}</p>` : ""}
        ${renderWatchSection(post)}
      `;
    } catch {
      root.innerHTML = `<a href="/" class="back-link">← Back to home</a><p class="not-found">Sorry, this post couldn't be found.</p>`;
    }
  }
  document.addEventListener("DOMContentLoaded", loadPost);
</script>
</body>
</html>
