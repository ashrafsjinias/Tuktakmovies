<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading… — TukTakMovies</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="css/style.css">

<style>
  /* Small, page-specific styles only — the rest comes from css/style.css */

  .post-detail {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .post-detail .post-hero-img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .post-detail h1 {
    font-family: var(--serif);
    font-size: clamp(24px, 3.2vw, 36px);
    margin: 0 0 6px;
  }

  .post-detail .tagline {
    font-style: italic;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .post-detail .post-meta {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 16px;
  }

  .post-detail .post-meta .stars {
    color: var(--gold);
    font-weight: 600;
  }

  .post-detail .genre-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .post-detail .genre-pills span {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .post-detail .post-excerpt {
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .post-detail .cast-line {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 26px;
  }

  .post-detail .cast-line strong {
    color: var(--ink);
  }

  /* Where to Watch */

  .post-detail .watch-section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 26px;
  }

  .post-detail .watch-section h3 {
    margin: 0 0 10px;
    font-size: 15px;
  }

  .post-detail .watch-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .post-detail .watch-pills span {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  /* Clickable Watch Provider */

  .post-detail .watch-pills a {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .post-detail .watch-pills a:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .post-detail .watch-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0;
  }

  .post-detail .watch-note a {
    color: var(--accent);
    font-weight: 600;
  }

  /* Trailer */

  .post-detail .trailer-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    margin-bottom: 26px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    background: #000;
  }

  .post-detail .trailer-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .post-detail .back-link {
    display: inline-block;
    margin-bottom: 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
  }

  .post-detail .not-found {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
</style>

</head>

<body>

<header class="site-header">
  <div class="container header-inner">

```
<a href="/" class="logo">
  <span class="logo-mark">🎬</span>

  <span class="logo-text">
    TUKTAK<strong>MOVIES</strong>

    <small>
      MOVIE NEWS, REVIEWS &amp; MORE
    </small>
  </span>
</a>
```

  </div>
</header>

<main class="post-detail" id="post-detail">

  <a href="/" class="back-link">
    ← Back to home
  </a>

  <p>Loading…</p>

</main>

<script>

  /* Escape text before inserting into HTML */

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* Where to Watch Section */

  function renderWatchSection(post) {

    const providers = (post.watch_providers || "")
      .split(",")
      .map(provider => provider.trim())
      .filter(Boolean);

    if (!providers.length && !post.watch_link) {

      return `
        <div class="watch-section">

          <h3>Where to Watch</h3>

          <p class="watch-note">
            Streaming availability isn't listed for this title yet.
          </p>

        </div>
      `;
    }


    const safeWatchLink = post.watch_link
      ? escapeHtml(post.watch_link)
      : "";


    return `
      <div class="watch-section">

        <h3>Where to Watch</h3>

        ${providers.length ? `
          <div class="watch-pills">

            ${providers.map(provider => {

              const safeProvider = escapeHtml(provider);

              return safeWatchLink
                ? `
                  <a
                    href="${safeWatchLink}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${safeProvider}
                  </a>
                `
                : `
                  <span>
                    ${safeProvider}
                  </span>
                `;

            }).join("")}

          </div>
        ` : ""}


        <p class="watch-note">

          Availability may vary by region and change over time.

          ${safeWatchLink ? `
            <a
              href="${safeWatchLink}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Check current availability →
            </a>
          ` : ""}

        </p>

      </div>
    `;
  }


  /* Load Movie / Post */

  async function loadPost() {

    const root = document.getElementById("post-detail");

    const id = new URLSearchParams(
      location.search
    ).get("id");


    if (!id) {

      root.innerHTML = `
        <a href="/" class="back-link">
          ← Back to home
        </a>

        <p class="not-found">
          No post specified.
        </p>
      `;

      return;
    }


    try {

      const res = await fetch(
        `/api/posts/${encodeURIComponent(id)}`
      );


      if (!res.ok) {
        throw new Error("Post not found");
      }


      const data = await res.json();

      const post = data.post;


      if (!post) {
        throw new Error("Post not found");
      }


      document.title =
        `${post.title || "Post"} — TukTakMovies`;


      /* Meta Information */

      const metaParts = [];


      if (post.post_date) {

        metaParts.push(
          `📅 ${escapeHtml(post.post_date)}`
        );

      }


      if (post.year) {

        metaParts.push(
          escapeHtml(post.year)
        );

      }


      if (post.runtime) {

        const runtime = Number(post.runtime);

        const hours = Math.floor(runtime / 60);

        const minutes = runtime % 60;


        metaParts.push(
          hours
            ? `${hours}h ${minutes}m`
            : `${minutes}m`
        );

      }


      if (post.comments) {

        metaParts.push(
          `💬 ${escapeHtml(post.comments)} Comments`
        );

      }


      const ratingValue =
        post.rating ?? post.score;


      if (ratingValue != null) {

        metaParts.push(
          `<span class="stars">
            ⭐ ${escapeHtml(ratingValue)}
          </span>`
        );

      }


      /* Genres */

      const genrePills =
        (post.genres || "")

          .split(",")

          .map(genre => genre.trim())

          .filter(Boolean)

          .map(genre =>
            `<span>${escapeHtml(genre)}</span>`
          )

          .join("");


      /* Hero Image */

      const heroImg =
        post.backdrop || post.image;


      /* Safe values */

      const safeTitle =
        escapeHtml(post.title);

      const safeTagline =
        escapeHtml(post.tagline);

      const safeExcerpt =
        escapeHtml(post.excerpt);

      const safeCast =
        escapeHtml(post.cast_names);


      /* Render Page */

      root.innerHTML = `

        <a href="/" class="back-link">
          ← Back to home
        </a>


        ${heroImg ? `

          <img
            class="post-hero-img"
            src="${escapeHtml(heroImg)}"
            alt="${safeTitle}"
            loading="lazy"
          >

        ` : ""}


        <h1>
          ${safeTitle}
        </h1>


        ${post.tagline ? `

          <p class="tagline">
            ${safeTagline}
          </p>

        ` : ""}


        <div class="post-meta">

          ${metaParts
            .map(part => `<span>${part}</span>`)
            .join("")
          }

        </div>


        ${genrePills ? `

          <div class="genre-pills">
            ${genrePills}
          </div>

        ` : ""}


        ${post.trailer_key ? `

          <div class="trailer-wrap">

            <iframe
              src="https://www.youtube.com/embed/${encodeURIComponent(post.trailer_key)}"
              title="${safeTitle} Trailer"
              allowfullscreen
              loading="lazy"
            ></iframe>

          </div>

        ` : ""}


        ${post.excerpt ? `

          <p class="post-excerpt">
            ${safeExcerpt}
          </p>

        ` : ""}


        ${post.cast_names ? `

          <p class="cast-line">

            <strong>
              Starring:
            </strong>

            ${safeCast}

          </p>

        ` : ""}


        ${renderWatchSection(post)}

      `;


    } catch (error) {

      console.error(error);


      root.innerHTML = `

        <a href="/" class="back-link">
          ← Back to home
        </a>

        <p class="not-found">
          Sorry, this post couldn't be found.
        </p>

      `;

    }

  }


  document.addEventListener(
    "DOMContentLoaded",
    loadPost
  );

</script>

</body>
</html>
