<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse by Genre — TukTakMovies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .list-page{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  .list-page h1{font-family:var(--serif);font-size:clamp(24px,3vw,32px);margin:0 0 16px;}
  .list-empty{color:var(--ink-soft);padding:40px 0;text-align:center;grid-column:1/-1;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">🎬</span>
      <span class="logo-text">TUKTAK<strong>MOVIES</strong>
        <small>MOVIE NEWS, REVIEWS &amp; MORE</small>
      </span>
    </a>
  </div>
</header>

<main class="list-page">
  <h1 id="genre-title">Browse by Genre</h1>
  <div class="genre-tabs" id="genre-tabs"></div>
  <div class="grid grid-4" id="genre-page-grid"></div>
</main>

<script>
  // slug = used in the URL (/genre/sci-fi), label = shown to the person,
  // match = the actual text TMDB stores in the genres column (some differ
  // from the friendly label, e.g. TMDB calls it "Science Fiction").
  const GENRES = [
    { slug: "action",    label: "Action",    match: "Action" },
    { slug: "adventure", label: "Adventure", match: "Adventure" },
    { slug: "comedy",    label: "Comedy",    match: "Comedy" },
    { slug: "drama",     label: "Drama",     match: "Drama" },
    { slug: "horror",    label: "Horror",    match: "Horror" },
    { slug: "sci-fi",    label: "Sci-Fi",    match: "Science Fiction" },
    { slug: "animation", label: "Animation", match: "Animation" },
    { slug: "thriller",  label: "Thriller",  match: "Thriller" },
    { slug: "romance",   label: "Romance",   match: "Romance" },
    { slug: "fantasy",   label: "Fantasy",   match: "Fantasy" },
  ];

  function thumbHtmlFor(post) {
    const img = post.image
      ? `<img src="${post.image}" alt="${post.title} poster" loading="lazy">`
      : `<div class="no-image">${post.title}</div>`;
    const score = post.score ?? post.rating;
    const badge = score != null ? `<span class="score">${score}</span>` : "";
    return `<div class="thumb">${img}${badge}</div>`;
  }

  let allMovies = [];

  function renderGenre(genre) {
    document.getElementById("genre-title").textContent = `${genre.label} Movies`;
    document.title = `${genre.label} Movies — TukTakMovies`;

    const grid = document.getElementById("genre-page-grid");
    const filtered = allMovies.filter(m => (m.genres || "").toLowerCase().includes(genre.match.toLowerCase()));

    grid.innerHTML = filtered.length
      ? filtered.map(p => `
          <a class="card" href="/movie/${p.id}">
            ${thumbHtmlFor(p)}
            <div class="body">
              <h3>${p.title}</h3>
              <div class="sub">
                <span>${p.year || ""}</span>
                <span class="stars">⭐ ${p.rating ?? "—"}</span>
              </div>
            </div>
          </a>`).join("")
      : `<p class="list-empty">No ${genre.label} movies yet — check back after the next TMDB sync.</p>`;
  }

  function setActiveTab(slug) {
    document.querySelectorAll("#genre-tabs button").forEach(b => {
      b.classList.toggle("active", b.dataset.slug === slug);
    });
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const requestedSlug = (params.get("slug") || "action").toLowerCase();
    const initial = GENRES.find(g => g.slug === requestedSlug) || GENRES[0];

    const tabsEl = document.getElementById("genre-tabs");
    tabsEl.innerHTML = GENRES.map(g =>
      `<button type="button" data-slug="${g.slug}">${g.label}</button>`
    ).join("");
    tabsEl.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const genre = GENRES.find(g => g.slug === btn.dataset.slug);
        history.pushState({}, "", `/genre/${genre.slug}`);
        setActiveTab(genre.slug);
        renderGenre(genre);
      });
    });

    try {
      const res = await fetch("/api/posts?type=movie&limit=200");
      const data = res.ok ? await res.json() : { posts: [] };
      allMovies = data.posts || [];
    } catch {
      allMovies = [];
    }

    setActiveTab(initial.slug);
    renderGenre(initial);
  }

  document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
