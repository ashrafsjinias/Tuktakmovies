<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap — TukTakMovies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .static-page{max-width:820px;margin:0 auto;padding:28px 20px 60px;}
  .static-page h1{font-family:var(--serif);font-size:clamp(24px,3vw,32px);margin:0 0 20px;}
  .static-page h2{font-size:16px;margin:26crypto0px;}
  .static-page ul{margin:0 0 8px 0;list-style:none;}
  .static-page li{padding:6px 0;border-bottom:1px solid var(--line);}
  .static-page a{color:var(--accent);}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">🎬</span>
      <span class="logo-text">TUKTAK<strong>MOVIES</strong>
        <small>MOVIE NEWS, REVIEWS &amp; MORE</small>
      </span>
    </a>
  </div>
</header>

<main class="static-page">
  <h1>Sitemap</h1>

  <h2>Pages</h2>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/movies">Movies</a></li>
    <li><a href="/reviews">Reviews</a></li>
    <li><a href="/articles">Articles</a></li>
    <li><a href="/about">About Us</a></li>
    <li><a href="/contact">Contact Us</a></li>
    <li><a href="/write-for-us">Write For Us</a></li>
    <li><a href="/privacy-policy">Privacy Policy</a></li>
    <li><a href="/terms">Terms of Use</a></li>
    <li><a href="/disclaimer">Disclaimer</a></li>
    <li><a href="/dmca">DMCA</a></li>
  </ul>

  <h2>Movie Reviews</h2>
  <ul id="sitemap-review"></ul>
  <h2>Movies</h2>
  <ul id="sitemap-movie"></ul>
  <h2>Articles</h2>
  <ul id="sitemap-article"></ul>
</main>

<script>
  async function loadSection(type, elId) {
    const el = document.getElementById(elId);
    try {
      const res = await fetch(`/api/posts?type=${type}&limit=200`);
      const data = res.ok ? await res.json() : { posts: [] };
      const posts = data.posts || [];
      el.innerHTML = posts.length
        ? posts.map(p => `<li><a href="/movie/${p.id}">${p.title}</a></li>`).join("")
        : `<li style="color:var(--ink-soft);">No posts yet.</li>`;
    } catch {
      el.innerHTML = `<li style="color:var(--ink-soft);">Couldn't load.</li>`;
    }
  }
  document.addEventListener("DOMContentLoaded", () => {
    loadSection("review", "sitemap-review");
    loadSection("movie", "sitemap-movie");
    loadSection("article", "sitemap-article");
  });
</script>
</body>
</html>
